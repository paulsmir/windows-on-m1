name: Apple AGX ARM64 WDK

on:
  push:
    paths:
      - ".github/workflows/apple-agx-wdk.yml"
      - "Directory.Build.props"
      - "packages.config"
      - "drivers/apple-agx/**"
  pull_request:
    paths:
      - ".github/workflows/apple-agx-wdk.yml"
      - "Directory.Build.props"
      - "packages.config"
      - "drivers/apple-agx/**"
  workflow_dispatch:

jobs:
  build-arm64:
    name: build-arm64 (${{ matrix.name }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            qualification: false
            artifact: AppleAgx-ARM64-Debug
          - name: power-qualification
            qualification: true
            artifact: AppleAgx-ARM64-PowerQualification
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2

      - name: Restore official SDK and WDK packages
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Expose WDK host tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (!$stampInf) { throw "stampinf.exe was not found in the restored WDK" }
          $stampInf.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build AppleAgx for ARM64
        run: >-
          msbuild drivers\apple-agx\windows\AppleAgx.vcxproj
          /m
          /t:Clean,Build
          /p:Configuration=Debug
          /p:Platform=ARM64
          /p:RunCodeAnalysis=true
          /p:AppleAgxPowerQualification=${{ matrix.qualification }}

      - name: Sign qualification catalog with ephemeral test certificate
        if: matrix.qualification == true
        shell: pwsh
        run: |
          $catalog = Get-ChildItem drivers/apple-agx/windows/ARM64/Debug -Recurse -Filter appleagx.cat |
            Select-Object -First 1
          $signTool = Get-ChildItem packages -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Select-Object -First 1
          if (!$catalog) { throw "appleagx.cat was not found" }
          if (!$signTool) { throw "signtool.exe was not found in the restored WDK" }
          $certificatePath = Join-Path $catalog.Directory.FullName "AppleAgxTest.cer"
          $certificate = $null
          $trustedCertificate = $null
          try {
            $certificate = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=AppleAgx G2 Qualification Run $env:GITHUB_RUN_ID" `
              -CertStoreLocation Cert:\CurrentUser\My `
              -KeyExportPolicy NonExportable `
              -KeyUsage DigitalSignature `
              -NotAfter (Get-Date).AddDays(7)
            Export-Certificate -Cert $certificate -FilePath $certificatePath -Type CERT | Out-Null
            $trustedCertificate = Import-Certificate -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\Root
            & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $catalog.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
            & $signTool.FullName verify /pa /v $catalog.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $LASTEXITCODE" }
          } finally {
            if ($trustedCertificate) {
              Remove-Item "Cert:\CurrentUser\Root\$($trustedCertificate.Thumbprint)" -Force
            }
            if ($certificate) {
              Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force
            }
          }

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            drivers/apple-agx/windows/ARM64/Debug/**/*.sys
            drivers/apple-agx/windows/ARM64/Debug/**/*.inf
            drivers/apple-agx/windows/ARM64/Debug/**/*.cat
            drivers/apple-agx/windows/ARM64/Debug/**/*.cer
            drivers/apple-agx/windows/ARM64/Debug/**/*.pdb
